nameOverride: "livekit-server"
fullnameOverride: ""

replicaCount: 1

# Tắt cái default của helm chart gốc
# ko tắt nó sẽ lấy của cái khác (vd pp191225)
envFrom: []

image:
  repository: livekit/livekit-server
  # Ghim đúng appVersion của chart 1.9.0 (không dùng latest: pod pull lại có thể nhảy version ngoài ý muốn)
  tag: "v1.9.0"
  pullPolicy: IfNotPresent
  # Thêm imagePullSecrets nếu dùng private registry
  # pullSecrets:
  #   - name: regcred

imagePullSecrets: []

# Chart không có preStop; LiveKit nhận SIGTERM thì đợi hết người trong phòng mới thoát.
# 18000s (5h) làm mỗi lần redeploy (strategy Recreate) có thể treo tới 5h -> devtest để 10 phút.
terminationGracePeriodSeconds: 600

# Configuration for livekit
livekit:
  port: 7880
  log_level: info
  # LiveKit báo người rời/phòng kết thúc về syncflow-room (xác thực bằng JWT ký bằng key bên dưới)
  webhook:
    api_key: devkey
    urls:
      - http://prod-syncflow-room.syncflow-room.svc.cluster.local:3030/api/livekit/webhook
  # bắt buộc phải có cái này
  key_file: "keys.yaml"
  rtc:
    tcp_port: 7881
    # Topology: pod hostNetwork trên worker k3s-worker-51 (VPN 10.10.10.12). Client chỉ thấy IP public của VPS
    # GCP 34.126.172.66; VPS DNAT UDP 50000-60000 (trừ 51820) về 10.10.10.12 (xem LIVEKIT_INFRA_NEW.md).
    # -> ICE candidate phải quảng bá 34.126.172.66, nên ghim cứng bằng node_ip.
    # use_external_ip PHẢI để false: nó hỏi STUN (stun.l.google.com) và nhận về IP egress của worker
    # (IP nhà mạng/NAT của worker), KHÔNG phải IP của VPS -> client sẽ gửi media sai chỗ.
    # Nếu đổi VPS/IP public: sửa node_ip ở ĐÂY và ở tenants/livekit-server/values.yaml (2 file giống hệt nhau).
    use_external_ip: false
    node_ip: "34.126.172.66"
    port_range_start: 50000
    port_range_end: 60000
    # STUN free của google
    stun_servers:
      - "stun.l.google.com:19302"
  
  redis:
    enabled: false
    # address: "alert-urchin-60909.upstash.io:6379"
    # use_tls: true # Upstash Redis chỉ hỗ trợ TLS
    # db: 0
  
  # API keys - KHÔNG nên config trực tiếp ở đây
  # keys: {}
    # devkey: "<LIVEKIT_API_SECRET>"   # secret thật nằm trong SealedSecret livekit-server-secret (key keys.yaml), KHÔNG ghi vào repo
  
  turn:
    enabled: false
    domain: "turn.kruzetech.dev"
    tls_port: 5349
    udp_port: 3478
    secret: "your-turn-secret"
    external_tls: false # Để false vì Nginx/LB thường sẽ đẩy thẳng traffic thô ở các port này vào

# Bảo livekit đọc config từ secret tên là livekit-server-secret
# Nó tự tìm key LIVEKIT_KEYS
storeKeysInSecret:
  enabled: true
  existingSecret: "livekit-server-secret"
  keys: {}


# Thêm các cấu hình monitoring
prometheus:
  enabled: false
  port: 7882

# enable Health checks
# if dont, below health check config will be fail because
# livekit server dont have /health endpoint
health:
  enabled: true
  port: 8080
  path: "/health"

# Chart livekit-server 1.9.0 KHÔNG đọc khối `ingress:` này (nó chỉ render Ingress khi loadBalancer.type != disable).
# Domain livekit.kruzetech.dev đi qua nginx trên VPS -> 10.10.10.12:7880 (xem MODIFY_RESERVE_PROXY.md),
# KHÔNG đi qua ingress-nginx trong cluster. Để enabled:false cho khỏi hiểu nhầm / lỡ bật là đụng nhau.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: livekit.kruzetech.dev
      paths:
        - path: /
          pathType: Prefix


# Service của chart được điều khiển bằng khối loadBalancer (KHÔNG phải `service:`).
# type: disable  -> Service ClusterIP, không NodePort/Ingress/LoadBalancer.
# servicePort: 7880 -> room gọi admin API qua http://prod-livekit-server.livekit-server.svc.cluster.local:7880
#   (mặc định chart là 80, khác với LIVEKIT_API_URL của syncflow-room nên phải đặt 7880).
# Pod chạy hostNetwork nên 7880/7881 TCP và UDP 50000-60000 mở thẳng trên node; Service chỉ dùng cho traffic trong cluster.
loadBalancer:
  type: disable
  servicePort: 7880

# service:
#   type: ClusterIP
#   port: 7881
#   annotations: {}
    # cloud.google.com/load-balancer-type: "Internal" # GCP internal LB
    # service.beta.kubernetes.io/aws-load-balancer-type: "nlb" # AWS NLB
  
# Chỉ bật nếu dùng turn và trên cloud
# còn có reverse proxy LB riêng thì bỏ qua
turnLoadbalancer:
  enabled: false
  annotations: {}

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 80
  behavior: {}

# Pod Disruption Budget cho HA
# Pod Disruption Budget là một tính năng của Kubernetes cho phép bạn chỉ định số lượng pod có thể bị gián đoạn trong một thời gian nhất định.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1

# Thêm label cụ thể cho node chạy LiveKit
nodeSelector:
  kubernetes.io/hostname: "k3s-worker-51"

# LiveKit cần CPU nhiều hơn RAM
resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "1000m"
    memory: "512Mi"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podHostNetwork: true

podAnnotations:
  sidecar.istio.io/inject: "false"
  linkerd.io/inject: disabled
  # Thêm annotations cho monitoring, Prometheus thường (khác với Prometheus Operator)
  prometheus.io/scrape: "true"
  # Builtin metrics endpoint của LiveKit
  prometheus.io/port: "7882"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

tolerations: []

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - livekit-server
        topologyKey: kubernetes.io/hostname

deploymentStrategy:
  type: Recreate
  # rollingUpdate:
  #   maxSurge: 1
  #   maxUnavailable: 0

deploymentAnnotations: {}

# Persistent Volume cho logs/config
persistence:
  enabled: false
  # storageClass: ""
  # accessMode: ReadWriteOnce
  # size: 1Gi
  # mountPath: /var/log/livekit

# Extra volumes và mounts
extraVolumes: []
extraVolumeMounts: []

# Environment variables
env:
  - name: LIVEKIT_DEBUG
    value: "true"
  - name: LIVEKIT_DEVELOPMENT
    value: "false"
  # - name: LIVEKIT_REDIS_PASSWORD
  #   valueFrom:
  #     secretKeyRef:
  #       name: livekit-server-secret
  #       key: REDIS_PASSWORD

initContainers: []
sidecars: []

# Chỉ dùng khi deploy google cloud với GCP LB
gcp:
  backendConfig:
    enabled: false
    name: ""
    timeoutSec: 36000
    connectionDraining:
      drainingTimeoutSec: 60

# ServiceMonitor cho Prometheus Operator
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  annotations: {}

podMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s

networkPolicy:
  enabled: false
  ingress: []
  egress: []

podLabels: {}
extraManifests: []