# Helm values cho syncflow-teacher-studio (chart backend-service-chart) - Next.js chạy `node server.js` (standalone)

image:
  repository: registry.kruzetech.dev/syncflow-teacher-studio
  pullPolicy: IfNotPresent
  # Tag git-<sha 40 hex> do CI đẩy lên Nexus; argocd-image-updater sẽ tự ghi đè giá trị này.
  # Lần đầu: thay bằng tag của lần CI đầu tiên chạy xanh trên repo Sync_Flow_Teacher-Studio.
  tag: "git-d2a52a6721eb7e0dec44e7142ca444d253f973ea"

imagePullSecrets:
  - name: katech-registry

nameOverride: "syncflow-teacher-studio"
fullnameOverride: ""

replicaCount: 1

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Image chạy USER node (uid 1000).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000
  annotations: {}

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: teacher-studio.kruzetech.dev
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: "50m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

# Đường health lấy đúng từ HEALTHCHECK trong Dockerfile (route src/app/healthz).
livenessProbe:
  httpGet:
    path: /healthz
    port: 3000
  initialDelaySeconds: 20
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: 3000
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 12

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

envFrom:
  - configMapRef:
      name: syncflow-teacher-studio-config

configMap:
  enabled: false
  data: {}

secrets:
  enabled: false
  data: {}

# readOnlyRootFilesystem: true nên Next cần chỗ ghi cache (ảnh tối ưu, ISR) và /tmp.
volumes:
  - name: next-cache
    emptyDir: {}
  - name: tmp
    emptyDir: {}

volumeMounts:
  - name: next-cache
    mountPath: /app/.next/cache
  - name: tmp
    mountPath: /tmp

persistence:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}

httpRoute:
  enabled: false
