kind: DaemonSet

serviceAccount:
  create: true

rbac:
  create: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

config:
  service: |
    [SERVICE]
        Flush        1
        Daemon       Off
        Log_Level    info
        Parsers_File parsers.conf
        Parsers_File custom_parsers.conf
        HTTP_Server  On
        HTTP_Listen  0.0.0.0
        HTTP_Port    2020

  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log

        Exclude_Path /var/log/containers/*fluent-bit*.log
        
        Parser cri-log
        Tag kube.*
        Mem_Buf_Limit 50MB
        Skip_Long_Lines On

  # Parser cri built-in đặt application log vào field `message`, nhưng filter
  # kubernetes chỉ merge JSON từ field tên `log` (hardcode). Clone lại cri với
  # capture group đổi thành `log` để Merge_Log / K8S-Logging.Parser hoạt động.
  customParsers: |
    [PARSER]
        Name        cri-log
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Merge_Log_Trim On
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude On

    # Log không phải JSON (nginx, argocd...) không được merge nên vẫn giữ `log`.
    # Đổi lại thành `message` để trùng field cũ đang dùng trên Kibana.
    [FILTER]
        Name   modify
        Match  kube.*
        Rename log message

  outputs: |
    [OUTPUT]
        Name es
        Match kube.*
        Host elasticsearch-cluster-es-http.eck-system.svc.cluster.local
        Port 9200

        HTTP_User ${ELASTIC_USERNAME}
        HTTP_Passwd ${ELASTIC_PASSWORD}
        
        Logstash_Format On
        TLS On
        TLS.Verify Off

        Suppress_Type_Name On

        # Key có dấu chấm bị ES hiểu là object lồng nhau. ECK operator log theo
        # chuẩn ECS (service.version, service.type) nên đã chốt mapping `service`
        # thành object, khiến `service` dạng string của app katech bị reject.
        Replace_Dots On

        # Chunk bị ES từ chối là hỏng vĩnh viễn; retry vô hạn (False) khiến nó kẹt
        # trong buffer mãi, đầy Mem_Buf_Limit rồi chặn tail của mọi namespace.
        Retry_Limit 5

        # Buffer mặc định quá nhỏ để đọc response bulk khi có nhiều doc lỗi
        # ("cannot increase buffer"), làm Fluent Bit không biết doc nào đã vào và
        # gửi lại cả chunk -> log trùng lặp.
        Buffer_Size 1M
        Trace_Error On
  # outputs: |
  #   [OUTPUT]
  #       Name stdout
  #       Match kube.*

env:
  - name: ELASTIC_USERNAME
    valueFrom:
      secretKeyRef:
        name: fluent-bit-secrets
        key: ELASTIC_USERNAME

  - name: ELASTIC_PASSWORD
    valueFrom:
      secretKeyRef:
        name: fluent-bit-secrets
        key: ELASTIC_PASSWORD