apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eck-system

resources:
  - namespace.yaml
  - elasticsearch.yaml

helmCharts:
  - name: eck-operator
    repo: https://helm.elastic.co
    version: 3.4.0   # Sử dụng phiên bản mới nhất
    releaseName: elastic-operator
    namespace: eck-system
    valuesFile: values.yaml