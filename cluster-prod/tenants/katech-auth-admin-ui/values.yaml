# Helm values cho katech-auth-admin-ui (chart backend-service-chart)

image:
  repository: registry.kruzetech.dev/katech-auth-admin-ui
  # tag 'dev' là mutable -> phải Always, không thì redeploy không kéo image mới
  pullPolicy: Always
  tag: "dev"

imagePullSecrets:
  - name: katech-registry

nameOverride: "katech-auth-admin-ui"
fullnameOverride: ""

replicaCount: 1

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  # Ảnh dùng nginx-unprivileged: chạy non-root nên phải listen 8080, không bind được :80.
  # Chart lấy containerPort và ingress backend port từ service.port, nên để cả hai là 8080.
  port: 8080
  targetPort: 8080
  annotations: {}

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: katech-admin-ui.kruzetech.dev
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "128Mi"

# Đường health lấy đúng từ HEALTHCHECK trong Dockerfile của service.
livenessProbe:
  httpGet:
    path: /
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /
    port: 8080
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

envFrom:
  - configMapRef:
      name: katech-auth-admin-ui-config

configMap:
  enabled: false
  data: {}

secrets:
  enabled: false
  data: {}

volumes: []
volumeMounts: []

persistence:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}

httpRoute:
  enabled: false
