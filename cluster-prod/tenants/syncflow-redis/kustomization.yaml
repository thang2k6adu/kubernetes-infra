apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: syncflow-redis

resources:
  - namespace.yaml
  - sealed-secret.yaml

helmCharts:
  - name: redis
    repo: https://charts.bitnami.com/bitnami
    version: 20.9.0
    releaseName: prod
    namespace: syncflow-redis
    valuesFile: values.yaml
