apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: katech-mailhog

resources:
  - configmap.yaml
  - namespace.yaml

helmCharts:
  - name: mailhog
    repo: https://codecentric.github.io/helm-charts
    version: 5.8.0
    releaseName: prod
    namespace: katech-mailhog
    valuesFile: values.yaml
