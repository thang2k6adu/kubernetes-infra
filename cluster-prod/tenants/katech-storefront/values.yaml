# Helm values cho katech-storefront (chart backend-service-chart)

image:
  repository: registry.kruzetech.dev/katech-storefront
  # tag 'dev' là mutable -> phải Always, không thì redeploy không kéo image mới
  pullPolicy: Always
  tag: "dev"

imagePullSecrets:
  - name: katech-registry

nameOverride: "katech-storefront"
fullnameOverride: ""

replicaCount: 1

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000
  annotations: {}

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: katech-storefront.kruzetech.dev
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# Đường health lấy đúng từ HEALTHCHECK trong Dockerfile của service.
livenessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 60
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

envFrom:
  - configMapRef:
      name: katech-storefront-config

configMap:
  enabled: false
  data: {}

secrets:
  enabled: false
  data: {}

volumes: []
volumeMounts: []

persistence:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}

httpRoute:
  enabled: false
