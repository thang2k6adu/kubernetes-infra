# Helm values cho katech-auth-sso (chart backend-service-chart)

image:
  repository: registry.kruzetech.dev/katech-auth-sso
  # tag 'dev' là mutable -> phải Always, không thì redeploy không kéo image mới
  pullPolicy: Always
  tag: "git-e2d287cdcb02d7ca5b5cd859c3bdb581f56a5e18"
imagePullSecrets:
  - name: katech-registry
nameOverride: "katech-auth-sso"
fullnameOverride: ""
replicaCount: 1
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""
podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts: []
resources:
  requests:
    cpu: "200m"
    memory: "384Mi"
  limits:
    cpu: "1"
    memory: "1Gi"
# Đường health lấy đúng từ HEALTHCHECK trong Dockerfile của service.
livenessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 6
readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
envFrom:
  - configMapRef:
      name: katech-auth-sso-config
  - secretRef:
      name: katech-auth-sso-secret
configMap:
  enabled: false
  data: {}
secrets:
  enabled: false
  data: {}
# readOnlyRootFilesystem: true nên JVM cần /tmp ghi được (Tomcat temp dir).
volumes:
  - name: tmp
    emptyDir: {}
volumeMounts:
  - name: tmp
    mountPath: /tmp
persistence:
  enabled: false
nodeSelector: {}
tolerations: []
affinity: {}
httpRoute:
  enabled: false
