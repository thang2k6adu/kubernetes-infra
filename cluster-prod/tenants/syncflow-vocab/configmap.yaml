apiVersion: v1
data:
  AUTH_SERVICE_URL: http://prod-syncflow-auth.syncflow-auth.svc.cluster.local:3000
  CORS_ORIGIN: '*'
  DATABASE_URL: jdbc:postgresql://prod-syncflow-db.syncflow-db.svc.cluster.local:5432/kruzetech_vocab
