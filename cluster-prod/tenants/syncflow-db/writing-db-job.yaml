# Tạo role + database kruzetech_writing trên Postgres ĐÃ CHẠY sẵn.
# Script initdb của Postgres chỉ chạy lúc khởi tạo volume lần đầu, nên DB thêm sau đó (writing) phải tạo bằng Job này.
# Chạy sau mỗi lần ArgoCD sync (PostSync), idempotent: chạy lại không lỗi và cũng cập nhật mật khẩu role theo secret.
apiVersion: batch/v1
kind: Job
metadata:
  name: syncflow-writing-db-init
  namespace: syncflow-db
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          env:
            - name: PGHOST
              value: prod-syncflow-db
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: syncflow-db-secret
                  key: POSTGRES_PASSWORD
            - name: WRITING_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: syncflow-db-secret
                  key: KRUZETECH_WRITING_DB_PASSWORD
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -q; do echo "waiting for postgres"; sleep 2; done
              psql -v ON_ERROR_STOP=1 -v pw="$WRITING_DB_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE kruzetech_writing LOGIN PASSWORD %L', :'pw')
               WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'kruzetech_writing')\gexec
              SELECT format('ALTER ROLE kruzetech_writing LOGIN PASSWORD %L', :'pw')\gexec
              SELECT 'CREATE DATABASE kruzetech_writing OWNER kruzetech_writing'
               WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'kruzetech_writing')\gexec
              GRANT ALL PRIVILEGES ON DATABASE kruzetech_writing TO kruzetech_writing;
              REVOKE CONNECT ON DATABASE kruzetech_writing FROM PUBLIC;
              SQL
              echo "kruzetech_writing ready"
