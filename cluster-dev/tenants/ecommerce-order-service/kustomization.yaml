apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecommerce-order-service

resources:
  - configmap.yaml
  - sealed-secret.yaml
  - namespace.yaml

# Chart vendor trong repo (cluster-*/charts) thay vì helm pull mỗi lần sync:
# kustomize giải nén chart vào chính thư mục đang render, mà ArgoCD repo-server
# dùng lại cache giữa các lần sync — render đứt giữa chừng một lần là lần sau
# "failed to untar: ... already exists" và Application kẹt ComparisonError.
helmGlobals:
  chartHome: ../../charts

helmCharts:
  - name: backend-service-chart
    releaseName: prod
    namespace: ecommerce-order-service
    valuesFile: values.yaml
