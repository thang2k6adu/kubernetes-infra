apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: {{SERVICE_NAME}}

resources:
  - namespace.yaml

helmCharts:
  - name: rabbitmq
    repo: https://charts.bitnami.com/bitnami
    version: 16.0.14
    releaseName: prod
    namespace: {{SERVICE_NAME}}
    valuesFile: values.yaml
